<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motores Garcia</title>


<style>

body{

    font-family:Arial, sans-serif;
    background-image:url("img/fondo.jpg");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

}


.login{

    background:white;
    padding:40px;
    width:350px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
    text-align:center;

}


.logo{

    width:80px;
    height:auto;
    margin-bottom:15px;

}


h1{

    margin-bottom:20px;

}


input{

    width:90%;
    padding:10px;
    margin:10px 0;

}


button{

    padding:10px 20px;
    margin-top:10px;
    cursor:pointer;

}


button:hover{

    background:#333;
    color:white;

}


a{

    display:block;
    margin-top:15px;

}


</style>


</head>



<body>


<div class="login">


<img src="img/logo.jpg" class="logo">

<h3>Bienvenido</h3>



<form action="login.php" method="POST">



<input 
type="email"
name="correo"
placeholder="Correo electrónico"
autocomplete="email"
required>



<input 
type="password"
name="contraseña"
placeholder="Contraseña"
autocomplete="current-password"
required>



<button type="submit">

</button>



</form>
